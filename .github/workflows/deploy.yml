# Builds, checks and publishes the site to GitHub Pages.
#
# One-time setup in the repository: Settings → Pages → Build and deployment →
# Source: GitHub Actions. Until then every push and pull request is still
# built and checked; only the publishing is skipped, with a notice saying why.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time, and never cancel one halfway.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Is GitHub Pages switched on?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not switched on for this repository, so the site was built and checked but not published. Settings → Pages → Build and deployment → Source: GitHub Actions."
          fi

      - name: Pages address
        id: config
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v6

      # The sub-path the site is served from: /<repo> for a project site, empty
      # for a custom domain or a <user>.github.io repository. Without Pages the
      # project-site path is assumed, so the checks still cover it.
      - name: Base path
        id: base
        run: |
          if [ "${{ steps.pages.outputs.enabled }}" = "true" ]; then
            echo "path=${{ steps.config.outputs.base_path }}" >> "$GITHUB_OUTPUT"
            echo "origin=${{ steps.config.outputs.origin }}" >> "$GITHUB_OUTPUT"
          else
            echo "path=/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install exactly what package-lock.json records
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Lint
        run: npm run lint

      # Builds the whole site — the home page and every /pageN/ route — into
      # dist/, then checks the built output.
      - name: Build and check the site
        env:
          SITE_URL: ${{ steps.base.outputs.origin }}
          BASE_PATH: ${{ steps.base.outputs.path }}
        run: |
          npm run build
          node scripts/check-site.mjs

      - name: Upload the site
        if: steps.pages.outputs.enabled == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    # Only main deploys — the github-pages environment protection rule rejects
    # any other branch, so a master (or other) push just builds and checks.
    if: needs.build.outputs.publish == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
